{% extends "revista/base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Administradores</h2>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Dirección</th>
        <th>Carne</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      {% for administrador in administradores %}
      <tr>
        <td>{{ administrador.nombre }}</td>
        <td>{{ administrador.direccion }}</td>
        <td>{{ administrador.carne }}</td>
        <td>
          <a href="{% url 'administrador-detail' administrador.pk %}" class="btn btn-info btn-sm">Ver</a>
          <a href="{% url 'administrador-edit' administrador.pk %}" class="btn btn-warning btn-sm">Editar</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
