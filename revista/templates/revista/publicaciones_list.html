{% extends "revista/base.html" %}

{% block content %}
<div class="container mt-4">
  <h2>Publicaciones</h2>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Título</th>
        <th>Autor</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      {% for publicacion in object_list %}
      <tr>
        <td>{{ publicacion.titulo }}</td>
        <td>{{ publicacion.autor }}</td>
        <td>
          <a href="{% url 'publicacion-detail' publicacion.pk %}" class="btn btn-info btn-sm">Ver</a>
          <a href="{% url 'publicacion-edit' publicacion.pk %}" class="btn btn-warning btn-sm">Editar</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
